<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry — Detection Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container result-page">

        <div class="header">
            <div class="eyebrow">
                <span class="dot"></span>
                <span>Analysis complete</span>
            </div>
            <h1>Detection Result</h1>
            <p>{{ video_filename }}</p>
        </div>

        <div class="result-video">
            <div class="video-frame">
                <video controls>
                    <source src="{{ url_for('uploaded_file', filename=video_filename) }}">
                    Your browser does not support video playback.
                </video>
                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>
            </div>
        </div>

        <div class="result-section">
            <p class="result-label">Prediction</p>
            <div class="prediction {% if prediction == 'Violence' %}violence{% else %}nonviolence{% endif %}">
                {{ prediction }}
            </div>
        </div>

        <div class="result-section">
            <p class="result-label">Confidence</p>
            <div class="confidence">{{ confidence }}%</div>

            <div class="progress-container" style="--meter-color: {% if prediction == 'Violence' %}var(--red){% else %}var(--green){% endif %};">
                {% for i in range(20) %}
                    <div class="seg {% if (i + 1) * 5 <= confidence|int %}filled{% endif %}"></div>
                {% endfor %}
            </div>
            <div class="scale-labels">
                <span>0</span>
                <span>50</span>
                <span>100</span>
            </div>
        </div>

        <div class="footer-row">
            <span class="timestamp">Model: frame-sequence classifier</span>
            <a href="/" class="back-link">Analyze another →</a>
        </div>

    </div>

</body>

</html>
